<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 FF之日 - 比奇堡休假行程表</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 比奇堡柔和主題色系 */
            --bg-ocean-top: #E0F7FA;
            --bg-ocean-bottom: #B2EBF2;
            --sponge-yellow: #FFF176;
            --sponge-border: #FBC02D;
            --patrick-pink: #FFCDD2;
            --patrick-accent: #F06292;
            --squidward-teal: #80CBC4;
            --sand-cream: #FFFDE7;
            --card-bg: rgba(255, 255, 255, 0.92);
            --text-primary: #1E3A5F;
            --text-secondary: #546E7A;
            --shadow-soft: 0 10px 25px -5px rgba(30, 58, 95, 0.08), 0 4px 10px -2px rgba(30, 58, 95, 0.04);
            --shadow-card: 0 6px 16px rgba(0, 131, 143, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(180deg, var(--bg-ocean-top) 0%, var(--bg-ocean-bottom) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            padding-bottom: 40px;
        }

        /* 比奇堡背景泡泡與海洋花朵裝飾 */
        .ocean-decor {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            bottom: -60px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.2));
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: floatUp linear infinite;
        }

        .bubble:nth-child(1) { width: 24px; height: 24px; left: 10%; animation-duration: 14s; animation-delay: 0s; }
        .bubble:nth-child(2) { width: 14px; height: 14px; left: 28%; animation-duration: 10s; animation-delay: 2s; }
        .bubble:nth-child(3) { width: 32px; height: 32px; left: 55%; animation-duration: 18s; animation-delay: 4s; }
        .bubble:nth-child(4) { width: 18px; height: 18px; left: 78%; animation-duration: 12s; animation-delay: 1s; }
        .bubble:nth-child(5) { width: 22px; height: 22px; left: 90%; animation-duration: 15s; animation-delay: 5s; }

        @keyframes floatUp {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            15% { opacity: 0.75; }
            50% { transform: translateY(-50vh) translateX(12px); }
            85% { opacity: 0.75; }
            100% { transform: translateY(-110vh) translateX(-8px); opacity: 0; }
        }

        /* 海洋雲朵花朵 SVG 背景紋理 */
        .flower-bg {
            position: fixed;
            opacity: 0.14;
            z-index: 0;
            pointer-events: none;
        }
        .flower-1 { top: 8%; right: -20px; width: 140px; transform: rotate(15deg); }
        .flower-2 { bottom: 12%; left: -30px; width: 160px; transform: rotate(-20deg); }

        /* 主容器 - 手機優先置中 */
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px 16px 32px;
            position: relative;
            z-index: 1;
        }

        /* Header 區塊 */
        .hero-header {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 24px 20px;
            box-shadow: var(--shadow-soft);
            border: 3px solid #FFFFFF;
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
            text-align: center;
        }

        /* 頂部海綿孔洞裝飾條 */
        .hero-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 10px;
            background
